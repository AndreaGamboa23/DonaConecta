[project]
name = "donaconecta-backend"
version = "0.1.0"
description = "API REST de DonaConecta conectada a SQL Server Express"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic[email]>=2.10,<3",
    "pyodbc>=5.2,<6",
    "argon2-cffi>=23.1,<26",
    "pyjwt>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "cryptography>=44,<47",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "httpx>=0.27,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
