<header class="row g-4 align-items-end mb-4">
  <div class="col-12 col-lg-8">
    <p class="dc-panel-seccion text-uppercase fw-bold small mb-2">{{ seccion() }}</p>
    <h1 class="display-6 fw-bold mb-2">{{ titulo() }}</h1>
    <p class="lead fs-6 text-secondary mb-0">{{ descripcion() }}</p>
  </div>
  <div class="col-12 col-lg-4 d-none d-lg-flex justify-content-end">
    <span class="dc-panel-sello d-inline-flex align-items-center justify-content-center rounded-circle">
      <app-icon [name]="icono()" aria-hidden="true" />
    </span>
  </div>
</header>
