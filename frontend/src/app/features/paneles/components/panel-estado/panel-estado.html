@switch (estado()) {
  @case ('cargando') {
    <div class="d-flex align-items-center gap-2 py-4 text-secondary" role="status">
      <span class="spinner-border spinner-border-sm text-primary" aria-hidden="true"></span>
      <span>Cargando información…</span>
    </div>
  }
  @case ('vacio') {
    <div class="text-center py-5 px-3">
      <span class="dc-panel-vacio d-inline-flex align-items-center justify-content-center rounded-circle mb-3">
        <app-icon name="box" aria-hidden="true" />
      </span>
      <p class="fw-semibold mb-1">No hay información para mostrar</p>
      <p class="small text-secondary mb-0">{{ mensaje() }}</p>
    </div>
  }
  @case ('error') {
    <div class="alert alert-warning border-0 d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3" role="alert">
      <span>{{ mensaje() }}</span>
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="reintentar.emit()">
        Reintentar
      </button>
    </div>
  }
}
