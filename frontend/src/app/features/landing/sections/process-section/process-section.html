<section id="como-funciona" class="dc-section-space bg-light">
  <div class="container">
    <div class="row g-4 g-lg-5 align-items-end mb-5 mb-lg-6">
      <div class="col-12 col-lg-8">
        <span class="dc-eyebrow mb-3">Cuatro etapas</span>
        <h2 class="display-5 fw-bold mb-3">Cómo funciona DonaConecta</h2>
        <p class="lead text-secondary mb-0">
          Un recorrido sencillo para que tu donación llegue a quien la necesita y pueda ser
          seguida con claridad.
        </p>
      </div>
      <div class="col-12 col-lg-4 text-lg-end">
        <a routerLink="/como-donar" class="btn btn-outline-primary">
          Ver la guía completa
        </a>
      </div>
    </div>

    <div class="row g-3 g-lg-4 dc-step-grid">
      @for (step of steps; track step.number) {
        <div class="col-12 col-md-6 col-xl-3">
          <article class="dc-step-card card p-4 h-100">
            <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
              <span class="dc-step-big-number" aria-hidden="true">{{ step.number }}</span>
              <span
                class="dc-tile-icon bg-white shadow-sm"
                [class.text-primary]="step.tone === 'blue'"
                [class.text-success]="step.tone === 'green'"
                [class.text-warning]="step.tone === 'amber'"
              >
                <app-icon [name]="step.icon" />
              </span>
            </div>
            <h3 class="h5 fw-bold mb-3">{{ step.title }}</h3>
            <p class="small text-secondary mb-0">{{ step.text }}</p>
          </article>
        </div>
      }
    </div>

  </div>
</section>
