<section id="inicio" class="dc-hero position-relative text-white overflow-hidden">
  <picture class="dc-photo-bg">
    <source
      media="(max-width: 575.98px)"
      srcset="/assets/images/nosotros-comunidad-movil.webp"
      type="image/webp"
    />
    <img
      src="/assets/images/nosotros-comunidad-opt.webp"
      srcset="/assets/images/nosotros-comunidad-movil.webp 960w, /assets/images/nosotros-comunidad-opt.webp 1672w"
      sizes="100vw"
      width="1672"
      height="941"
      alt="Personas colaborando en una comunidad andina"
      fetchpriority="high"
      loading="eager"
    />
  </picture>

  <div class="dc-photo-overlay dc-hero-overlay" aria-hidden="true"></div>
  <span class="dc-hero-orbit d-none d-lg-block" aria-hidden="true"></span>
  <span class="dc-hero-dot d-none d-md-block" aria-hidden="true"></span>

  <div class="container position-relative dc-hero-inner">
    <div class="row">
      <div class="col-12 col-xl-9 dc-hero-content">
        <p class="dc-hero-kicker mb-4">Una comunidad · Huancayo, Junín</p>
        <h1 class="dc-hero-title fw-bold mb-4">
          Juntos podemos hacer que la
          <span class="dc-hero-highlight">solidaridad</span>
          llegue más lejos.
        </h1>
        <p class="dc-hero-copy mb-0">
          Porque cuando una comunidad se une, cada pequeño aporte puede transformar una vida.
        </p>
      </div>
    </div>

    <div class="row align-items-end gy-4 mt-4 mt-lg-5">
      <div class="col-12 col-lg-8">
        <div class="d-flex flex-column flex-sm-row flex-wrap gap-3">
          <a routerLink="/como-donar" class="btn btn-warning btn-lg px-4">
            Descubre cómo donar
          </a>
          <a routerLink="/nosotros" class="btn btn-outline-light btn-lg px-4">
            Conoce nuestra comunidad
          </a>
        </div>
        <p class="dc-hero-note mt-4 mb-0">
          <span class="dc-hero-note-mark" aria-hidden="true"></span>
          Solo bienes materiales · Sin pagos ni transferencias
        </p>
      </div>
    </div>
  </div>

  <div class="dc-wave-bottom" aria-hidden="true"></div>
</section>
