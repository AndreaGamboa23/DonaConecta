<section id="participa" class="dc-community position-relative text-white overflow-hidden">
  <picture class="dc-photo-bg">
    <source
      media="(max-width: 575.98px)"
      srcset="/assets/images/juntos-transformamos-movil.webp"
      type="image/webp"
    />
    <img
      src="/assets/images/juntos-transformamos-opt.webp"
      srcset="/assets/images/juntos-transformamos-movil.webp 960w, /assets/images/juntos-transformamos-opt.webp 1672w"
      sizes="100vw"
      width="1672"
      height="941"
      alt="Personas de la comunidad ayudándose entre sí"
      loading="lazy"
    />
  </picture>

  <div class="dc-photo-overlay dc-community-overlay" aria-hidden="true"></div>
  <span class="dc-community-arc d-none d-lg-block" aria-hidden="true"></span>

  <div class="container position-relative dc-section-space">
    <div class="row">
      <div class="col-12 col-xl-9">
        <span class="dc-eyebrow dc-eyebrow-light mb-3">Participación comunitaria</span>
        <h2 class="dc-community-title fw-bold mb-4">
          El cambio comienza cuando decidimos ayudar juntos.
        </h2>
        <p class="dc-community-copy mb-4">
          Un paquete de alimentos, una frazada o un cuaderno pueden mejorar el día de alguien.
          Cuando muchas personas aportan, el impacto llega más lejos.
        </p>

        <div class="d-flex flex-column flex-sm-row flex-wrap gap-3">
          <a routerLink="/como-donar" class="btn btn-warning btn-lg px-4 d-inline-flex align-items-center gap-2">
            <app-icon name="box" /> Ver qué puedes donar
          </a>
          <a [routerLink]="['/']" fragment="como-funciona" class="btn btn-outline-light btn-lg px-4">
            Conocer el proceso
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
