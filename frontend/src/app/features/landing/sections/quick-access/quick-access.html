<section class="dc-quick-access" aria-label="Accesos rápidos">
  <div class="container">
    <div class="dc-quick-panel rounded-4 shadow-sm p-3 p-md-4">
      <div class="row g-3 align-items-center">
        <div class="col-12 col-md-4">
          <div class="d-flex align-items-center gap-3">
            <span class="dc-quick-icon d-flex align-items-center justify-content-center flex-shrink-0">
              <app-icon name="pin" />
            </span>
            <div>
              <span class="d-block small text-secondary">Tu comunidad</span>
              <strong class="d-block">Huancayo, Junín</strong>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-8">
          <div class="row g-2 row-cols-2 row-cols-sm-4">
            @for (action of actions; track action.label) {
              <div class="col">
                <a
                  [routerLink]="action.route"
                  [fragment]="action.fragment || undefined"
                  class="dc-quick-link d-flex flex-column align-items-center justify-content-center gap-2 h-100 text-center text-decoration-none rounded-3 p-3"
                >
                  <span class="dc-quick-link-icon d-flex align-items-center justify-content-center">
                    <app-icon [name]="action.icon" />
                  </span>
                  <span class="small fw-semibold">{{ action.label }}</span>
                </a>
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
