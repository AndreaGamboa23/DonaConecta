<app-page-hero
  eyebrow="Comunicación segura"
  titulo="Mensajes"
  descripcion="Coordina entregas de bienes materiales con las instituciones en un espacio privado y autorizado."
  icono="chat"
/>

<section class="dc-section-space">
  <div class="container">
    <app-pending-notice
      [estado]="estado"
      titulo="La mensajería aún no está conectada"
      class="d-block mb-4"
    />

    <div class="row g-3 g-lg-4 align-items-stretch dc-chat-layout">
      <div
        class="col-12 col-lg-4"
        [class.d-none]="conversacionId() !== null"
        [class.d-lg-block]="conversacionId() !== null"
      >
        <app-bandeja-conversaciones (abrir)="abrirConversacion($event)" />
      </div>
      <div
        class="col-12 col-lg-8"
        [class.d-none]="conversacionId() === null"
        [class.d-lg-block]="conversacionId() === null"
      >
        <app-panel-conversacion
          [conversacionId]="conversacionId()"
          (volver)="volverBandeja()"
        />
      </div>
    </div>

    <div class="d-flex flex-wrap gap-2 mt-4">
      @if (sesion.autenticado()) {
        <a routerLink="/necesidades" class="btn btn-primary">Explorar necesidades</a>
      } @else {
        <a routerLink="/iniciar-sesion" class="btn btn-primary">Iniciar sesión</a>
      }
      <a routerLink="/mis-donaciones" class="btn btn-outline-secondary">Ver mis donaciones</a>
      <a routerLink="/como-donar" class="btn btn-outline-secondary">Cómo donar</a>
    </div>
  </div>
</section>
