<aside class="card rounded-4 shadow-sm h-100 dc-bandeja" aria-label="Bandeja de conversaciones">
  <div class="card-header bg-transparent border-0 pt-3 px-3 px-md-4">
    <h2 class="h5 fw-bold mb-2">Conversaciones</h2>
    <div class="input-group">
      <span class="input-group-text bg-white">
        <app-icon name="search" aria-hidden="true" />
      </span>
      <input
        type="search"
        class="form-control"
        aria-label="Buscar conversación"
        placeholder="Buscar por institución"
        autocomplete="off"
        [ngModel]="termino()"
        (ngModelChange)="termino.set($event)"
      />
    </div>
  </div>
  <div class="card-body px-3 px-md-4 pt-0">
    <div class="list-group list-group-flush rounded-3 border">
      <div class="list-group-item py-4 text-center text-secondary">
        <span class="dc-bandeja-icon d-inline-flex align-items-center justify-content-center rounded-circle mb-3">
          <app-icon name="chat" />
        </span>
        <p class="fw-semibold mb-1">
          {{ sinResultados() ? 'Sin coincidencias en esta búsqueda' : 'No hay conversaciones cargadas' }}
        </p>
        <p class="small mb-0">
          El acceso requiere una sesión real. No mostramos chats de ejemplo.
        </p>
      </div>
    </div>
  </div>
</aside>
