<section class="card rounded-4 shadow-sm h-100 d-flex flex-column" aria-label="Conversación">
  <div class="card-header bg-transparent border-0 pt-3 px-3 px-md-4">
    <div class="d-flex align-items-center gap-3">
      <span class="dc-chat-avatar d-flex align-items-center justify-content-center rounded-circle">
        <app-icon name="chat" />
      </span>
      <div>
        <h2 class="h6 fw-bold mb-0">Selecciona una conversación</h2>
        <small class="text-secondary">Solo participantes autorizados podrán leerla</small>
      </div>
    </div>
  </div>

  <div class="card-body dc-chat-body px-3 px-md-4 text-center d-flex flex-column justify-content-center">
    <span class="dc-chat-empty d-inline-flex align-items-center justify-content-center rounded-circle mx-auto mb-3">
      <app-icon name="mail" />
    </span>
    <p class="text-secondary small mb-1">No hay mensajes cargados.</p>
    <p class="text-secondary small mb-0">
      Los mensajes quedarán guardados y solo serán visibles para las personas autorizadas.
    </p>
  </div>

  <div class="card-footer bg-transparent border-0 px-3 px-md-4 pb-3">
    <app-pending-notice [estado]="estado" titulo="Envío de mensajes no disponible" />
    <div class="input-group mt-3">
      <label class="visually-hidden" for="mensaje-borrador">Escribe un mensaje</label>
      <input
        id="mensaje-borrador"
        type="text"
        class="form-control"
        placeholder="Escribe un mensaje…"
        disabled
      />
      <button class="btn btn-primary" type="button" disabled aria-label="Enviar mensaje">
        <app-icon name="send" />
      </button>
    </div>
    <small class="text-secondary d-block mt-2">
      El borrador no se guarda en este navegador ni se envía a ningún servidor.
    </small>
  </div>
</section>
