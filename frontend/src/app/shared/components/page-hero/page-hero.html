<section
  class="dc-page-hero position-relative overflow-hidden"
  [class.dc-page-hero--navy]="tono() === 'navy'"
  [class.dc-page-hero--green]="tono() === 'green'"
  [class.dc-page-hero--amber]="tono() === 'amber'"
>
  <div class="container position-relative py-5 py-lg-6">
    <div class="row align-items-center g-4">
      <div class="col-12 col-lg-8">
        <span class="dc-eyebrow mb-3">{{ eyebrow() }}</span>
        <h1 class="display-6 fw-bold mb-3">{{ titulo() }}</h1>
        <p class="lead mb-0 dc-page-hero-copy">{{ descripcion() }}</p>
      </div>
      <div class="col-12 col-lg-4 d-none d-lg-flex justify-content-end">
        <span class="dc-page-hero-mark d-flex align-items-center justify-content-center">
          <app-icon [name]="icono()" />
        </span>
      </div>
    </div>
  </div>
</section>
