<article class="card border-0 shadow-sm rounded-4 h-100 dc-producto-card">
  <div class="card-body d-flex flex-column p-3 p-md-4">
    <div class="d-flex align-items-start justify-content-between gap-3 mb-2">
      <span class="dc-producto-icon d-inline-flex align-items-center justify-content-center rounded-3">
        <app-icon [name]="categoria()?.icono || 'box'" aria-hidden="true" />
      </span>
      @if (categoria(); as categoria) {
        <a
          class="link-primary small fw-semibold text-decoration-none"
          [routerLink]="['/explorar', categoria.slug]"
        >
          {{ categoria.nombre }}
        </a>
      }
    </div>
    <h3 class="h6 fw-bold mb-2">
      <a
        class="stretched-link text-reset text-decoration-none"
        [routerLink]="['/explorar', producto().categoriaSlug, producto().slug]"
      >
        {{ producto().nombre }}
      </a>
    </h3>
    <p class="small text-secondary mb-3">{{ producto().descripcion }}</p>
    <div class="mt-auto d-flex flex-wrap gap-2">
      @for (condicion of producto().condiciones.slice(0, 2); track condicion) {
        <span class="badge rounded-pill text-bg-light fw-normal">{{ condicion }}</span>
      }
    </div>
  </div>
</article>
