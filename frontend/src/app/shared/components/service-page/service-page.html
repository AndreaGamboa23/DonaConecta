<app-page-hero
  [eyebrow]="eyebrow()"
  [titulo]="titulo()"
  [descripcion]="descripcion()"
  [icono]="icono()"
  [tono]="tono()"
/>

<section class="dc-section-space">
  <div class="container">
    <div class="row g-4 g-xl-5">
      <div class="col-12 col-xl-7">
        <app-pending-notice [estado]="estado()" [titulo]="tituloServicio()" />

        <div class="mt-4"><ng-content /></div>
      </div>

      <div class="col-12 col-xl-5">
        <app-empty-state
          [icono]="icono()"
          [titulo]="tituloVacio()"
          [mensaje]="mensajeVacio()"
          [accionPrincipal]="accionPrincipal()"
          [rutaPrincipal]="rutaPrincipal()"
          [accionSecundaria]="accionSecundaria()"
          [rutaSecundaria]="rutaSecundaria()"
        />
      </div>
    </div>
  </div>
</section>
