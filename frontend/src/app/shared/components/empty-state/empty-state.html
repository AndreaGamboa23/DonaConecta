<div class="dc-empty-state rounded-4 border text-center p-4 p-md-5">
  <span class="dc-empty-icon d-inline-flex align-items-center justify-content-center rounded-circle mb-3">
    <app-icon [name]="icono()" />
  </span>
  <h2 class="h5 fw-bold mb-2">{{ titulo() }}</h2>
  <p class="text-secondary mb-3">{{ mensaje() }}</p>
  @if (accionPrincipal() && rutaPrincipal()) {
    <a [routerLink]="rutaPrincipal()" class="btn btn-primary btn-sm me-2 mb-2">
      {{ accionPrincipal() }}
    </a>
  }
  @if (accionSecundaria() && rutaSecundaria()) {
    <a [routerLink]="rutaSecundaria()" class="btn btn-outline-secondary btn-sm mb-2">
      {{ accionSecundaria() }}
    </a>
  }
</div>
