<a
  class="dc-categoria-card card h-100 overflow-hidden text-decoration-none text-reset"
  [class.dc-categoria-destacada]="destacada()"
  [routerLink]="['/explorar', categoria().slug]"
  [attr.aria-label]="'Explorar bienes para donar en ' + categoria().nombre"
>
  <div class="dc-categoria-media position-relative">
    <img
      class="w-100 h-100 object-fit-cover"
      [src]="categoria().imagen"
      [alt]="categoria().altImagen"
      width="800"
      height="800"
      [attr.loading]="prioritaria() ? 'eager' : 'lazy'"
      [attr.fetchpriority]="prioritaria() ? 'high' : null"
    />
  </div>

  <div class="card-body d-flex flex-column p-3 p-md-4">
    <div class="d-flex align-items-center gap-2 mb-2">
      <span class="dc-categoria-icon d-inline-flex align-items-center justify-content-center">
        <app-icon [name]="categoria().icono" />
      </span>
      <span class="small text-secondary">Guía práctica</span>
    </div>
    <h3 class="h6 fw-bold mb-2">{{ categoria().nombre }}</h3>
    <p class="small text-secondary mb-3 flex-grow-1">{{ categoria().descripcion }}</p>
    <span class="d-inline-flex align-items-center gap-2 small fw-semibold text-primary">
      Explorar bienes
      <app-icon name="arrow-right" />
    </span>
  </div>
</a>
